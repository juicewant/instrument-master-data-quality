version: 2

seeds:
  - name: ref_countries
    columns:
      - name: iso2
        data_tests: [unique, not_null]

  - name: dq_rules
    columns:
      - name: rule_code
        data_tests: [unique, not_null]

models:
  - name: dq_issues
    columns:
      - name: issue_key
        data_tests: [unique, not_null]
      - name: rule_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dq_rules')
                field: rule_code
      - name: table_name
        data_tests:
          - accepted_values:
              arguments:
                values: ['customers', 'materials', 'installed_base']

  - name: dq_rule_validation
    columns:
      - name: rule_code
        data_tests: [unique, not_null]