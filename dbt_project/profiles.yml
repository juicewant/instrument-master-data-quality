mdq:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'mdq') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'mdq_local_pw') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'mdq') }}"
      schema: analytics
      threads: 4