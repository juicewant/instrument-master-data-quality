name: mdq
version: "1.0.0"
config-version: 2
profile: mdq

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  mdq:
    staging:
      +materialized: view
      +schema: staging
    quality:
      +materialized: table
      +schema: quality
    marts:
      +materialized: table
      +schema: marts

seeds:
  mdq:
    +schema: reference